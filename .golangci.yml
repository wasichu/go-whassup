version: "2"

linters:
  # standard set (errcheck, govet, ineffassign, staticcheck, unused) plus
  # linters that mechanically enforce AGENTS.md invariants.
  enable:
    - depguard   # architecture boundaries + banned modules
    - errorlint  # %w wrapping, errors.Is/As
    - forbidigo  # Bubble Tea owns the terminal
    - misspell
    - funlen    # function length
    - gocognit  # cognitive complexity
    - nestif    # deeply nested ifs
  settings:
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 4
    errcheck:
      # AGENTS.md: no `_ =` error discards.
      check-blank: true
    depguard:
      rules:
        no-cgo-sqlite:
          files: ["$all"]
          deny:
            - pkg: github.com/mattn/go-sqlite3
              desc: needs cgo; use modernc.org/sqlite
            - pkg: github.com/charmbracelet/bubbletea
              desc: v1 API; use charm.land/bubbletea/v2
            - pkg: github.com/charmbracelet/lipgloss
              desc: v1 API; use charm.land/lipgloss/v2
            - pkg: github.com/charmbracelet/bubbles
              desc: v1 API; use charm.land/bubbles/v2
            - pkg: charm.land/bubbles$
              desc: v1 API; use charm.land/bubbles/v2
        whatsmeow-only-in-wa:
          files: ["$all", "!**/internal/wa/**"]
          deny:
            - pkg: go.mau.fi/whatsmeow
              desc: only internal/wa may import whatsmeow
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: Bubble Tea owns stdout; log via slog to the log file
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: use log/slog (configured to write to the log file)
  exclusions:
    presets:
      - std-error-handling
    rules:
      # deferred Close on read paths / log files is fine to ignore
      - linters: [errcheck]
        source: "^\\s*defer .*\\.Close\\(\\)"
      # Table-driven tests are long by nature.
      - path: _test\.go
        linters: [funlen, gocognit]
      # Known offenders, being refactored (code-quality pass, 2026-10-18).
      # Each refactor commit deletes the entries it fixes; don't add new ones.
      - {path: internal/app/app\.go, linters: [gocognit, funlen], text: "`Run`|'Run'"}
      - {path: internal/app/encryption\.go, linters: [gocognit], text: "func `setUpEncryption`"}
      - {path: internal/app/encryption\.go, linters: [nestif], text: "source == config.KeySourceKeyring"}
      - {path: internal/store/keys\.go, linters: [gocognit], text: "resealMessages|resealReactions"}
      - {path: internal/store/recorder\.go, linters: [gocognit], text: "Handle"}
      - {path: internal/store/messages\.go, linters: [gocognit, funlen], text: "Messages|attachReactions"}
      - {path: internal/store/prune\.go, linters: [gocognit], text: "Prune"}
      - {path: internal/store/messages\.go, linters: [nestif], text: "m.Deleted"}
      - {path: internal/ui/cmds\.go, linters: [gocognit], text: "loadMessages"}
      - {path: internal/ui/conversation\.go, linters: [gocognit], text: "renderMessages"}
      - {path: internal/ui/info\.go, linters: [gocognit, nestif], text: "infoView|d.IsGroup"}
      - {path: internal/ui/login\.go, linters: [gocognit, funlen], text: "loginKey|loginView"}
      - {path: internal/ui/model\.go, linters: [gocognit, funlen], text: "Update|handleKey"}
      - {path: internal/ui/settings\.go, linters: [gocognit, funlen], text: "settingsKey"}
      - {path: internal/wa/translate\.go, linters: [gocognit, nestif], text: "historyFromProto|classifyMessage|sem != nil"}
      - {path: internal/wa/whatsmeow\.go, linters: [funlen], text: "handleEvent"}

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wasichu/go-whassup

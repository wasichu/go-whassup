# Runs the same gate as locally (`just check`), with the tool versions
# pinned in mise.toml. macOS too: the keychain code path is darwin-only.
# workflow_dispatch: bump-whatsmeow starts it on its branch (pull requests
# opened by a workflow can require approval). The status job attaches the
# dispatched result to the dependency commit so it appears on the PR.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: just check
      - run: just vulncheck
  status:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish dispatched check result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
        run: |
          case "$RESULT" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="check / dispatched" \
            -f description="Linux and macOS checks: $RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

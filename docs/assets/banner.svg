<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img"
     aria-label="Two chat bubbles on retro phones, tongues out, yelling WHASSUUUP! Below: go-whassup, WhatsApp in your terminal">
  <!-- A nod to the "Whassup?!" catchphrase of the late 90s: two chat-bubble
       characters yelling it down the phone. Our own drawing; no logos.
       The README shows banner.png, this rendered at 2x (1920x800) with
       headless Chromium, so the fonts look the same for every viewer. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <g id="handset">
      <!-- A retro corded handset: earpiece, grip, mouthpiece. -->
      <path d="M0 0 q-8 30 4 62 l14 -6 q-9 -25 -2 -50 z" fill="#45475a"/>
      <rect x="-12" y="-14" width="34" height="20" rx="8" fill="#585b70"/>
      <rect x="-6" y="52" width="34" height="20" rx="8" fill="#585b70"/>
    </g>
  </defs>

  <rect width="960" height="400" rx="24" fill="url(#bg)"/>

  <!-- Speed lines behind the shout. -->
  <g stroke="#f9e2af" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="470" y1="96" x2="462" y2="72"/>
    <line x1="420" y1="102" x2="404" y2="82"/>
    <line x1="520" y1="96" x2="532" y2="74"/>
    <line x1="440" y1="196" x2="430" y2="218"/>
    <line x1="500" y1="194" x2="508" y2="218"/>
  </g>

  <!-- Left character: a teal chat bubble, tongue out, phone to its ear. -->
  <g transform="translate(36 52) scale(0.82)">
    <path d="M30 0 H190 Q220 0 220 30 V150 Q220 180 190 180 H90 L48 214 L58 180 H30 Q0 180 0 150 V30 Q0 0 30 0 Z" fill="#94e2d5"/>
    <path d="M62 66 q16 -16 32 0" stroke="#11111b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M128 66 q16 -16 32 0" stroke="#11111b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="112" cy="122" rx="48" ry="34" fill="#11111b"/>
    <path d="M86 128 q26 62 52 0 z" fill="#f38ba8"/>
    <path d="M112 132 v24" stroke="#d2587b" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(228 38) rotate(14)"><use href="#handset"/></g>
  </g>

  <!-- Right character: a coral bubble, mirrored. -->
  <g transform="translate(924 52) scale(-0.82 0.82)">
    <path d="M30 0 H190 Q220 0 220 30 V150 Q220 180 190 180 H90 L48 214 L58 180 H30 Q0 180 0 150 V30 Q0 0 30 0 Z" fill="#fab387"/>
    <path d="M62 66 q16 -16 32 0" stroke="#11111b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M128 66 q16 -16 32 0" stroke="#11111b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="112" cy="122" rx="48" ry="34" fill="#11111b"/>
    <path d="M86 128 q26 62 52 0 z" fill="#f38ba8"/>
    <path d="M112 132 v24" stroke="#d2587b" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(228 38) rotate(14)"><use href="#handset"/></g>
  </g>

  <!-- The shout. -->
  <g transform="translate(480 158) rotate(-4)">
    <text text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="50"
          font-weight="900" fill="#11111b" stroke="#11111b" stroke-width="10" stroke-linejoin="round"
          letter-spacing="1">WHASSUUUP!</text>
    <text text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="50"
          font-weight="900" fill="#f9e2af" letter-spacing="1">WHASSUUUP!</text>
  </g>

  <!-- The name, as typed at a prompt. -->
  <text x="480" y="328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="46" font-weight="700" fill="#cdd6f4"><tspan fill="#a6e3a1">&gt;_</tspan> go-whassup</text>
  <text x="480" y="368" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" fill="#a6adc8">WhatsApp in your terminal</text>
</svg>
